<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

  </div>

    <div id="mainView">
      <div class="tabs">
        <button class="tab active" data-div="CELOL A">CELOL A</button>

  <aside class="sidebar">
    <h2>Movimentações</h2>
    <div id="transfersContainer" class="transfers"></div>
  </aside>
</div>

<script src="js/app.js"></script>
